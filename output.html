<!DOCTYPE html>
<html>
<head>

    <title>Appointment Output</title>

    <link rel="stylesheet" href="css/style.css">

</head>

<body>

<!-- Navbar -->
<nav>
    <a href="index.html">Home</a>
    <a href="doctors.html">Doctors</a>
    <a href="appointment.html">Appointment</a>
    <a href="output.html">Output</a>
</nav>

<div class="container">

    <div class="card">

        <h1>Appointment Records</h1>

        <table id="table">

            <tr>
                <th>Patient Name</th>
                <th>Doctor</th>
                <th>Date</th>
                <th>Time</th>
            </tr>

        </table>

        <br>

        <button onclick="clearData()">Clear All</button>

    </div>

</div>

<script>

var data = JSON.parse(localStorage.getItem("appointments")) || [];

var table = document.getElementById("table");

data.forEach(function(item){

    var row = table.insertRow();

    row.insertCell(0).innerText = item.name;
    row.insertCell(1).innerText = item.doctor;
    row.insertCell(2).innerText = item.date;
    row.insertCell(3).innerText = item.time;

});

function clearData(){

    localStorage.clear();

    location.reload();
}

</script>

</body>
</html>
