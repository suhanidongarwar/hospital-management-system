<!DOCTYPE html>
<html>
<head>
    <title>Output</title>
</head>
<body>

<h2>Appointment Details</h2>

<table border="1">
<tr>
    <th>Name</th>
    <th>Date</th>
    <th>Time</th>
</tr>
<tr>
    <td id="outName"></td>
    <td id="outDate"></td>
    <td id="outTime"></td>
</tr>
</table>

<script>
var data = JSON.parse(localStorage.getItem("appointment"));

if(data){
    document.getElementById("outName").innerText = data.name;
    document.getElementById("outDate").innerText = data.date;
    document.getElementById("outTime").innerText = data.time;
}
</script>

</body>
</html>
